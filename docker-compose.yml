name: sentinellus
services:
  backend:
    build: ./backend
    image: sentinellus-backend:latest
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      SENTINELLUS_DB: /data/sentinellus.db
      WORKER_IMAGE: sentinellus-worker:latest
      DOCKER_NETWORK: sentinellus_default
      MIN_WORKERS: "1"
      MAX_WORKERS: "12"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      CHAOS_MODE: "false"
      WORKER_COOLDOWN_SECONDS: "10"
      CIRCUIT_BREAKER_FAILURE_THRESHOLD: "2"
      AUTOSCALING_ENABLED: "true"
      AUTOSCALER_INTERVAL_SECONDS: "10"
      AUTOSCALER_COOLDOWN_SECONDS: "30"
      HEALTH_PROBE_INTERVAL_SECONDS: "5"
      SCALE_UP_CPU_PERCENT: "75"
      SCALE_UP_TOTAL_RPS: "20"
      SCALE_DOWN_CPU_PERCENT: "25"
      SCALE_DOWN_TOTAL_RPS: "3"
      SCALE_DOWN_CONSECUTIVE_CHECKS: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sentinellus_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - sentinellus_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - sentinellus_net
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sentinellus_net
    restart: unless-stopped

  worker-1: &worker
    build: ./backend
    image: sentinellus-worker:latest
    command: ["uvicorn", "app.worker:app", "--host", "0.0.0.0", "--port", "9000"]
    environment:
      WORKER_NAME: worker-node-01
    labels:
      sentinellus.role: worker
    expose:
      - "9000"
    networks:
      - sentinellus_net
    restart: unless-stopped

  worker-2:
    <<: *worker
    environment:
      WORKER_NAME: worker-node-02

  worker-3:
    <<: *worker
    environment:
      WORKER_NAME: worker-node-03

volumes:
  sentinellus_data:
  redis_data:
  frontend_node_modules:

networks:
  sentinellus_net:
    name: sentinellus_default
